<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Marginalia</title>
    <meta name="description" content="Sign in to access your reading list and book journal.">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Shared root styles -->
    <link rel="stylesheet" href="../styles.css">
    
    <!-- Page-specific styles -->
    <link rel="stylesheet" href="./styles.css">
    <script defer src="../js/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%238c3a2b' d='M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.1-1.3 4.85-1.4 1.25-.07 2.45.1 3.55.55.1.05.2.05.3.05.25 0 .5-.25.5-.5V6c-.6-.4-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z'/></svg>">
    <script>
    (function() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
</script>
<script defer src="./js/theme.js"></script>
</head>

<body class="auth-page login-page">

    <main class="card auth-card login-card" role="main" aria-labelledby="signin-heading">
        <h1 id="signin-heading">Sign-In</h1>
        <p class="lead">Welcome back. Enter your account details to continue.</p>

        <form id="loginForm" action="#" method="post" novalidate>
            <div class="input-wrapper">
                <input id="email" name="email" type="email" autocomplete="email" required placeholder=" "
                    inputmode="email" aria-describedby="emailHelp" />
                <label for="email">E-mail Address</label>
                <div id="emailHelp" class="helper" aria-hidden="true">We will never share your e-mail.</div>
            </div>

            <div class="input-wrapper">
                <input id="password" name="password" type="password" autocomplete="current-password" required
                    minlength="8" placeholder=" " aria-describedby="passwordHelp" />
                <label for="password">Password</label>
                <div id="emailHelp" class="helper" aria-hidden="true">We will never share your e-mail</div>
            </div>

            <div class="input-wrapper">
                <input id="password" name="password" type="password" autocomplete="current-password" required
                    minlength="8" placeholder=" " aria-describedby="passwordHelp" />
                <label for="password">Password</label>
                <button type="button" id="togglePassword" class="icon-btn toggle-btn" aria-pressed="false"
                    title="Show password">Show</button>
                <div id="passwordHelp" class="helper">Minimum of 8 characters.</div>
            </div>

            <div id="login-options" class="row login-options-row">
                <label class="checkbox">
                    <input type="checkbox" id="remember" name="remember" />
                    <span class="checkbox-custom" aria-hidden="true"></span>
                    <span> Remember me</span>
                </label>
                <a class="muted-link" href="#"
                    onClick="alert('Please contact support if you wish to change your password.')">Forgot password?</a>
            </div>

            <div>
                <button class="btn" type="submit">Sign in</button>
                <div>

                    <div id="create-account">
                        New to Marginalia? <a href="../signup/index.html" class="muted-link">Create an account</a>
                    </div>

                    <div id="formError" class="error" role="alert" aria-live="assertive" style="display:none"></div>
        </form>
    </main>
</body>

</html>
