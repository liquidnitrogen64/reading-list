<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insight Library | Marginalia</title>
    <meta name="description" content="Your complete collection of book reflections and insights.">

    <!-- Tab Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%238c3a2b' d='M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.1-1.3 4.85-1.4 1.25-.07 2.45.1 3.55.55.1.05.2.05.3.05.25 0 .5-.25.5-.5V6c-.6-.4-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z'/></svg>">

    <!-- Icons & Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <script defer src="../js/theme.js"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../dashboard/styles.css">
    <link rel="stylesheet" href="./styles.css">
</head>

<body class="library-body">

    <!-- Top Header -->
    <header class="dashboard-header">
        <div class="brand">
            <i class="fas fa-book-open"></i> Marginalia
        </div>
        <nav class="nav-links">
            <a href="../dashboard/index.html">Dashboard</a>
            <a href="../library/index.html" class="active">Library</a>
            <label style="cursor:pointer; display:flex; align-items:center; margin-left:0.5rem;" title="Toggle Dark Mode">
                <input type="checkbox" id="dmToggle" class="dm-toggle" style="display:none">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" class="dm-icon" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </label>
            <button id="logoutBtn" class="btn-outline">Log Out</button>
        </nav>
    </header>

    <main class="library-container">
        <section class="library-hero">
            <h1><i class="fas fa-feather-pointed"></i> Insight Library</h1>
            <p class="lead">Every book you've read and the key perspectives you gained from reading them.</p>

            <div class="library-controls">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="librarySearch" placeholder="Search by title, author, or keyword..." />
                </div>

                <div class="tag-filter-bar" id="libraryTagFilters">
                    <button class="tag-chip active" data-tag="all">All</button>
                    <button class="tag-chip" data-tag="Fiction">Fiction</button>
                    <button class="tag-chip" data-tag="Non-Fiction">Non-Fiction</button>
                    <button class="tag-chip" data-tag="Romance">Romance</button>
                    <button class="tag-chip" data-tag="Mystery">Mystery</button>
                    <button class="tag-chip" data-tag="Thriller">Thriller</button>
                    <button class="tag-chip" data-tag="Fantasy">Fantasy</button>
                    <button class="tag-chip" data-tag="Sci-Fi">Sci-Fi</button>
                    <button class="tag-chip" data-tag="Biography">Biography</button>
                    <button class="tag-chip" data-tag="Memoir">Memoir</button>
                    <button class="tag-chip" data-tag="Personal Growth">Personal Growth</button>
                    <button class="tag-chip" data-tag="History">History</button>
                    <button class="tag-chip" data-tag="Philosophy">Philosophy</button>
                    <button class="tag-chip" data-tag="Poetry">Poetry</button>
                    <button class="tag-chip" data-tag="Classic">Classic</button>
                </div>
            </div>
        </section>

        <section id="libraryGrid" class="library-grid">
            <!-- Cards rendered here -->
        </section>
    </main>

    <script src="./script.js"></script>
</body>

</html>
