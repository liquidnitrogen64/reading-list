<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign-up | Marginalia</title>
    <meta name="description" content="Create an account with Marginalia, and start actually thinking about the books you've read.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark light">
    
    <!-- Styles -->
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../login/styles.css">
    <link rel="stylesheet" href="./styles.css">
    <script defer src="../js/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%238c3a2b' d='M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.1-1.3 4.85-1.4 1.25-.07 2.45.1 3.55.55.1.05.2.05.3.05.25 0 .5-.25.5-.5V6c-.6-.4-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z'/></svg>">

    <script defer src="https://cdn.jsdelivr.net/npm/appwrite@21.4.0"></script>
    <script type="module" src="./script.js"></script>
    <script>
    (function() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
</script>
<script defer src="./js/theme.js"></script>
</head>
<body class="auth-page signup-page">
    <div class="theme-toggle-shell">
        <label class="theme-toggle" for="dmToggle" title="Toggle Dark Mode" aria-label="Toggle dark mode">
            <input type="checkbox" id="dmToggle" class="dm-toggle">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" class="dm-icon" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </label>
    </div>

    <main class="card auth-card signup-card" role="main" aria-labelledby="signup-heading">
        <h1 id="signup-heading">Create account</h1>
        <p class="lead">Get your Marginalia account ready in under a minute.</p>
        <form id="signupForm" action="#" method="post" novalidate>
            <div class="input-wrapper">
                <input id="email" name="email" type="email" autocomplete="email" required placeholder=" " />
                <label for="email">E-mail address</label>
            </div>

            <div class="input-wrapper">
                <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required placeholder=" " />
                <label for="password">Password</label>
                <button type="button" class="icon-btn toggle-btn" data-toggle="password" aria-pressed="false" title="Show password">Show</button>
                <div class="helper">Minimum of 8 characters.</div>
            </div>

            <div class="input-wrapper">
                <input id="confirmPassword" name="confirmPassowrd" type="password" minlength="8" autocomplete="new-password" required placeholder=" " />
                <label for="confirmPassword">Confirm password</label>
                <button type="button" class="icon-btn toggle-btn" data-toggle="confirmPassword" aria-pressed="false" title="Show confirm password">Show</button>
            </div>

            <div id="pwMismatch" class="error" role="alert" aria-live="polite" style="display:none;">Passwords do not match.</div>

            <button id="submitBtn" class="btn" type="submit" disabled>Sign up</button>

            <div id="create-account">
                Already have an account? <a href="../login/index.html" class="muted-link">Sign in</a>
            </div>
        </form>
    </main>
</body>
</html>
